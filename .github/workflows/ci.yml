name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here needs write access or a token.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20.19 is the floor Vite 7 sets; 22 is the current LTS. Both are tested because
        # the difference between them is where a Node API assumption would surface.
        node: ['20.19', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The previews are generated from web/styles.css, so a stylesheet change that breaks
      # the section split shows up here rather than the next time someone opens them.
      - name: Build design previews
        run: npm run design:build
